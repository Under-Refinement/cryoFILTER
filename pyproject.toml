# Publication classifier UI integration.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryofilter"
version = "0.1.0"
description = "cryo-EM contamination segmentation and particle filtering with CryoSPARC integration, annotation, and fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "numpy<2.0",
  "mrcfile>=1.4.0",
  "torch>=1.13.1",
  "torchvision>=0.14.1",
  "scikit-image>=0.21.0",
  "scikit-learn>=1.3.0",
  "matplotlib>=3.7.0",
  "scipy>=1.10.0",
  "tqdm>=4.65.0",
  "pyyaml>=6.0",
  "pandas>=1.5.0",
  "Pillow>=9.0.0",
  "pydantic>=2.0",
]

[project.scripts]
cryoFILTER = "cryofilter.cli:main"
cryofilter = "cryofilter.cli:main"
cryofilter-inference = "cryofilter.simple_inference:main"
cryofilter-bridge = "cryofilter.cryosparc.bridge.cli:main"
cryofilter-install-cryosparc-tools = "cryofilter.install_cryosparc_tools:main"

[project.optional-dependencies]
cryosparc-bridge = [
  "cryosparc-tools>=4.1",
]
test = ["pytest>=7.0"]
gui = ["PySide6>=6.5.0"]

[tool.setuptools.packages.find]
include = ["cryofilter*", "models*", "utils*"]

[tool.setuptools.package-data]
cryofilter = ["configs/*.json", "app/static/*", "data/publication/*.json", "data/publication/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
